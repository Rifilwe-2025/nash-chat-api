[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is intentionally absent — env.py reads DATABASE_URL through src.configs.

[post_write_hooks]
# Deliberately none. A hook that shells out to `ruff` fails whenever the virtualenv's Scripts
# directory is not on PATH — which is the normal case when Alembic is invoked as
# `python -m alembic`. Run `ruff format .` after generating a revision; CI enforces it anyway.
hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
