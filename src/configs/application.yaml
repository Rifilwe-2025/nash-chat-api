# Source of truth for configuration shape and defaults.
# Every value uses the format:  "${ENV_VAR:default} | type"
# The environment variable wins when set; otherwise the default is used.
# Supported types: str, int, float, bool, list

app:
  name: "${APP_NAME:Nash Chat API} | str"
  env: "${APP_ENV:local} | str"
  version: "${APP_VERSION:0.1.0} | str"
  debug: "${DEBUG:false} | bool"

server:
  host: "${HOST:127.0.0.1} | str"
  port: "${PORT:8000} | int"

database:
  url: "${DATABASE_URL:postgresql+asyncpg://postgres:qwerty@localhost:5432/nashdb} | str"
  test_url: "${DATABASE_TEST_URL:postgresql+asyncpg://postgres:qwerty@localhost:5432/nashdb_test} | str"
  echo: "${DATABASE_ECHO:false} | bool"
  pool_size: "${DATABASE_POOL_SIZE:10} | int"
  max_overflow: "${DATABASE_MAX_OVERFLOW:5} | int"

redis:
  url: "${REDIS_URL:redis://localhost:6379/0} | str"

llm:
  # Platform-provided credentials. Tenant bring-your-own keys are spec §9's open question —
  # the interface already threads a per-call key, so that decision does not change this shape.
  anthropic_api_key: "${ANTHROPIC_API_KEY:} | str"
  openai_api_key: "${OPENAI_API_KEY:} | str"
  gemini_api_key: "${GEMINI_API_KEY:} | str"
  request_timeout_seconds: "${LLM_REQUEST_TIMEOUT_SECONDS:60} | float"
  max_attempts: "${LLM_MAX_ATTEMPTS:3} | int"
  retry_base_delay_seconds: "${LLM_RETRY_BASE_DELAY_SECONDS:0.5} | float"
  retry_max_delay_seconds: "${LLM_RETRY_MAX_DELAY_SECONDS:8} | float"
  # Provider used when the configured one is rate limited or down. Empty disables fallback.
  fallback_provider: "${LLM_FALLBACK_PROVIDER:} | str"
  # Per-model prices for cost recording, as "<model-prefix>=<input>/<output>" in USD per million
  # tokens. Nothing is assumed: a model with no entry records tokens but no cost.
  price_table: "${LLM_PRICE_TABLE:} | list"

conversations:
  # Share of the remaining context window that conversation history may use, after the system
  # prompt and the reserved output room are taken out (spec §5.4).
  history_budget_fraction: "${CONVERSATION_HISTORY_BUDGET_FRACTION:0.5} | float"
  # Turns trimmed out of the prompt are folded into a rolling summary before they are dropped.
  summary_max_tokens: "${CONVERSATION_SUMMARY_MAX_TOKENS:512} | int"
  max_message_characters: "${CONVERSATION_MAX_MESSAGE_CHARACTERS:8000} | int"

knowledge_base:
  # Ingestion limits (spec §5.2). Bytes, checked before anything is extracted or stored.
  max_source_bytes: "${KB_MAX_SOURCE_BYTES:10485760} | int"
  max_tenant_bytes: "${KB_MAX_TENANT_BYTES:262144000} | int"
  url_fetch_timeout_seconds: "${KB_URL_FETCH_TIMEOUT_SECONDS:20} | float"
  # Allow fetching URLs that resolve to private or loopback addresses. Off outside local
  # development: an attacker-supplied URL would otherwise reach services inside the network.
  allow_private_urls: "${KB_ALLOW_PRIVATE_URLS:false} | bool"
  # PDFs and images have no extraction library in v1 — the model reads them natively (§5.2.3).
  extraction_provider: "${KB_EXTRACTION_PROVIDER:gemini} | str"
  extraction_model: "${KB_EXTRACTION_MODEL:gemini-2.0-flash} | str"
  extraction_max_tokens: "${KB_EXTRACTION_MAX_TOKENS:8192} | int"
  # Retrieval (spec §5.2.2). The injection budget is the smaller of a flat cap and a fraction of
  # the agent model's context window — a million-token window is no reason to spend a million
  # tokens of it on knowledge every turn.
  direct_injection_max_chars: "${KB_DIRECT_INJECTION_MAX_CHARS:48000} | int"
  context_budget_fraction: "${KB_CONTEXT_BUDGET_FRACTION:0.25} | float"
  keyword_top_n: "${KB_KEYWORD_TOP_N:5} | int"
  # Below this ts_rank_cd score a match is noise; retrieval reports "no relevant context" instead.
  keyword_min_rank: "${KB_KEYWORD_MIN_RANK:0.02} | float"

auth:
  # Override JWT_SECRET_KEY in every deployed environment — the default is for local use only.
  jwt_secret: "${JWT_SECRET_KEY:local-development-secret-change-me} | str"
  jwt_algorithm: "${JWT_ALGORITHM:HS256} | str"
  access_ttl_minutes: "${ACCESS_TOKEN_TTL_MINUTES:15} | int"
  refresh_ttl_days: "${REFRESH_TOKEN_TTL_DAYS:14} | int"

queue:
  # "redis" hands work to a worker and is what any deployment should use. "inline" runs it in the
  # caller instead — convenient locally and in tests, but the request still blocks.
  mode: "${QUEUE_MODE:inline} | str"
  task_soft_time_limit_seconds: "${QUEUE_TASK_SOFT_TIME_LIMIT_SECONDS:270} | int"
  task_time_limit_seconds: "${QUEUE_TASK_TIME_LIMIT_SECONDS:300} | int"
  max_retries: "${QUEUE_MAX_RETRIES:3} | int"
  retry_backoff_seconds: "${QUEUE_RETRY_BACKOFF_SECONDS:30} | int"

sync:
  # Default re-sync interval for a source that does not set its own. Zero disables scheduling.
  default_interval_minutes: "${SYNC_DEFAULT_INTERVAL_MINUTES:0} | int"
  min_interval_minutes: "${SYNC_MIN_INTERVAL_MINUTES:15} | int"
  # Consecutive failures before the source is reported as broken to the tenant (spec §5.2.1).
  failure_alert_threshold: "${SYNC_FAILURE_ALERT_THRESHOLD:3} | int"
  # How many records one connector pull may walk before stopping.
  max_records: "${SYNC_MAX_RECORDS:5000} | int"
  max_pages: "${SYNC_MAX_PAGES:50} | int"

tools:
  # Pattern A live tool calls (spec §5.2.1). A customer is waiting on every one of these, so the
  # timeout is short and the retry budget is one — a tool that has failed twice has failed.
  timeout_seconds: "${TOOLS_TIMEOUT_SECONDS:8} | float"
  max_retries: "${TOOLS_MAX_RETRIES:1} | int"
  # Ceiling on tool calls in one turn, when an agent's policy does not set its own. Bounds both
  # cost and the loop where a model keeps asking for the same tool.
  max_calls_per_turn: "${TOOLS_MAX_CALLS_PER_TURN:3} | int"
  # How much of a tool's rendered response may enter the prompt. A verbose API must not be able to
  # push the knowledge base or the conversation history out of the context window.
  max_result_characters: "${TOOLS_MAX_RESULT_CHARACTERS:4000} | int"
  user_agent: "${TOOLS_USER_AGENT:NashChatBot/1.0 (+agent-tools)} | str"
  # Allow tools whose host resolves to a private or loopback address. Off outside local
  # development: a tool endpoint is called with model-written arguments, so it is the last
  # place that should be able to reach inside the network.
  allow_private_urls: "${TOOLS_ALLOW_PRIVATE_URLS:false} | bool"

rate_limit:
  # "redis" is required in any deployment with more than one worker — the in-memory backend counts
  # per process, so the limit a tenant was sold would be multiplied by the worker count.
  backend: "${RATE_LIMIT_BACKEND:memory} | str"
  # Default requests per minute for a new API key, when the caller does not set one.
  default_per_minute: "${RATE_LIMIT_DEFAULT_PER_MINUTE:60} | int"
  max_per_minute: "${RATE_LIMIT_MAX_PER_MINUTE:6000} | int"

webhooks:
  timeout_seconds: "${WEBHOOK_TIMEOUT_SECONDS:5} | float"
  # Signing secrets are generated per endpoint; this is the header the signature travels in.
  signature_header: "${WEBHOOK_SIGNATURE_HEADER:X-Nash-Signature} | str"

whatsapp:
  # Meta Cloud API. A different provider (Twilio, 360dialog) is a second adapter behind the same
  # interface in `channels/whatsapp/internal/providers/`, selected per connection — not a fork here.
  api_base_url: "${WHATSAPP_API_BASE_URL:https://graph.facebook.com} | str"
  api_version: "${WHATSAPP_API_VERSION:v21.0} | str"
  request_timeout_seconds: "${WHATSAPP_REQUEST_TIMEOUT_SECONDS:15} | float"
  # WhatsApp's customer service window (spec §5.5, §6). Free-form messages are only allowed within
  # this many hours of the contact's last inbound message; outside it, only templates are delivered.
  session_window_hours: "${WHATSAPP_SESSION_WINDOW_HOURS:24} | int"
  # Largest inbound media the platform will download and read. WhatsApp's own cap is 16 MB for
  # video and 100 MB for documents; this is ours, applied before any bytes are extracted.
  max_media_bytes: "${WHATSAPP_MAX_MEDIA_BYTES:16777216} | int"
  # Public origin the webhook URL is built from, for the setup steps a tenant pastes into Meta.
  # Empty falls back to the origin of the request that asked for them.
  public_base_url: "${WHATSAPP_PUBLIC_BASE_URL:} | str"

docs:
  enabled: "${DOCS_ENABLED:true} | bool"
  swagger_path: "${DOCS_SWAGGER_PATH:/docs} | str"
  redoc_path: "${DOCS_REDOC_PATH:/redoc} | str"
  openapi_path: "${DOCS_OPENAPI_PATH:/openapi.json} | str"

logging:
  level: "${LOG_LEVEL:INFO} | str"

cors:
  allow_origins: "${CORS_ALLOW_ORIGINS:http://localhost:3000} | list"
