# Source of truth for configuration shape and defaults.
# Every value uses the format:  "${ENV_VAR:default} | type"
# The environment variable wins when set; otherwise the default is used.
# Supported types: str, int, float, bool, list

app:
  name: "${APP_NAME:Nash Chat API} | str"
  env: "${APP_ENV:local} | str"
  version: "${APP_VERSION:0.1.0} | str"
  debug: "${DEBUG:false} | bool"

server:
  host: "${HOST:127.0.0.1} | str"
  port: "${PORT:8000} | int"

database:
  url: "${DATABASE_URL:postgresql+asyncpg://postgres:qwerty@localhost:5432/nashdb} | str"
  test_url: "${DATABASE_TEST_URL:postgresql+asyncpg://postgres:qwerty@localhost:5432/nashdb_test} | str"
  echo: "${DATABASE_ECHO:false} | bool"
  pool_size: "${DATABASE_POOL_SIZE:10} | int"
  max_overflow: "${DATABASE_MAX_OVERFLOW:5} | int"

redis:
  url: "${REDIS_URL:redis://localhost:6379/0} | str"

llm:
  # Platform-provided credentials. Tenant bring-your-own keys are spec §9's open question —
  # the interface already threads a per-call key, so that decision does not change this shape.
  anthropic_api_key: "${ANTHROPIC_API_KEY:} | str"
  openai_api_key: "${OPENAI_API_KEY:} | str"
  gemini_api_key: "${GEMINI_API_KEY:} | str"
  request_timeout_seconds: "${LLM_REQUEST_TIMEOUT_SECONDS:60} | float"
  max_attempts: "${LLM_MAX_ATTEMPTS:3} | int"
  retry_base_delay_seconds: "${LLM_RETRY_BASE_DELAY_SECONDS:0.5} | float"
  retry_max_delay_seconds: "${LLM_RETRY_MAX_DELAY_SECONDS:8} | float"
  # Provider used when the configured one is rate limited or down. Empty disables fallback.
  fallback_provider: "${LLM_FALLBACK_PROVIDER:} | str"

auth:
  # Override JWT_SECRET_KEY in every deployed environment — the default is for local use only.
  jwt_secret: "${JWT_SECRET_KEY:local-development-secret-change-me} | str"
  jwt_algorithm: "${JWT_ALGORITHM:HS256} | str"
  access_ttl_minutes: "${ACCESS_TOKEN_TTL_MINUTES:15} | int"
  refresh_ttl_days: "${REFRESH_TOKEN_TTL_DAYS:14} | int"

docs:
  enabled: "${DOCS_ENABLED:true} | bool"
  swagger_path: "${DOCS_SWAGGER_PATH:/docs} | str"
  redoc_path: "${DOCS_REDOC_PATH:/redoc} | str"
  openapi_path: "${DOCS_OPENAPI_PATH:/openapi.json} | str"

logging:
  level: "${LOG_LEVEL:INFO} | str"

cors:
  allow_origins: "${CORS_ALLOW_ORIGINS:http://localhost:3000} | list"
